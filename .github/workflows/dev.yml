name: Development workflow
on:
    push:
        branches:
            - dev
            - 'dev/**'

    workflow_dispatch:
jobs:
    lint:
        runs-on: macos-latest
        steps:
            - name: Get files
              uses: actions/checkout@v7
            - name: Install dependencies
              uses: ./.github/actions/setup-node
            - name: Run lint
              run: npm run lint
              working-directory: frontend
    react-test:
        runs-on: macos-latest
        steps:
            - name: Get files
              uses: actions/checkout@v7
            - name: Install dependencies
              uses: ./.github/actions/setup-node
            - name: Run tests
              run: npm test
              working-directory: frontend
    python-test:
        runs-on: macos-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Get files
              uses: actions/checkout@v7
            - name: Setup python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pytest
            - name: Run tests
              run: pytest
    report:
        needs: [lint, react-test, python-test]
        if: failure()
        runs-on: ubuntu-latest
        steps:
            - name: Output report
              run: echo 'One or more jobs failed'
