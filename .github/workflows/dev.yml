name: Development workflow
on:
    push:
        branches:
            - dev
            - 'dev/**'

    workflow_dispatch:
jobs:
    lint:
        runs-on: macos
        steps:
            - name: Get files
              uses: actions/checkout@v7
            - name: Install node.js
              uses: actions/setup-node@v7
              uses: './github/actions'
            - name: Run lint
              run: npm run lint
    react-test:
        needs: lint
        runs-on: macos
        steps:
            - name: Get files
              uses: actions/checkout@v7
            uses: './github/actions'
            - name: Run tests
              run: npm test
    python-test:
      runs-on: macOS
      steps:
        - name: Get files
          uses: actions/checkout@v7
        - name: Setup python
          actions: actions/setup-python@v6
          with: 
            python-version: 3.12
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest
        - name: Run tests
          run: pytest
    report:
      needs: [lint, react-test, python-test]
      if: failure()
      steps:
        - name: Output report
          run: echo ''