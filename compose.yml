services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ekada
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: mysql+pymysql://root@db:3306/ekada
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: db+mysql+pymysql://root@db:3306/ekada
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Pulls match data from Leaguepedia. Start it with: docker compose --profile worker up
  # Needs WIKI_USERNAME_ME / WIKI_PASSWORD_ME in backend/.env (see backend/.env.example)
  worker:
    build: ./backend
    profiles: ["worker"]
    working_dir: /app/backend
    command: celery -A api_worker worker --loglevel=info
    environment: *backend-env
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db-data:
